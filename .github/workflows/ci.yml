name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # .slnx (solution v9 format) needs the 9.x SDK; TargetFramework stays net8.0.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ExceptionKnowledgeBase.slnx

      - name: Build
        run: dotnet build ExceptionKnowledgeBase.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ExceptionKnowledgeBase.Tests/ExceptionKnowledgeBase.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/api/Dockerfile
          push: false
          tags: exception-knowledge-base/api:ci

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/worker/Dockerfile
          push: false
          tags: exception-knowledge-base/worker:ci
